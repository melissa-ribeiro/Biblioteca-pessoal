<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Pessoal - Cadastrar Livro</title>
    <link rel="stylesheet" href="./css/cadastroLivros.css">
</head>

<body>
    <div class="dashboard-layout">
        <header class="header">
            <div class="logo">
                <!-- IMAGEM -->
                <img src="./imagens/img1.png" alt="Logo">

                <!-- BIBLIOTECA PESSOAL -->
                <span>BIBLIOTECA PESSOAL</span>
            </div>
            <!-- BOTÃO VOLTAR -->
            <div class="back">
                <a href="./meuslivros.html">
                    <button id="btnSair">Voltar</button>
                </a>
            </div>
        </header>

        <div class="newbook">
            <div class="boasvindas">
                <span>Editar livro</span>
            </div>
        </div>
    </div>

    <div class="container-form">
        <span>Preencha as informações abaixo para editar um título da sua biblioteca.</span>

        <div class="form">
            <div class="campo-input">
                <p>Título do livro:</p>
                <input type="text" id="ipt_titulo" placeholder="Escreva o título do livro">
            </div>

            <div class="campo-input">
                <p>Autor do livros:</p>
                <input type="text" id="ipt_autor" placeholder="Escreva o autor do livro">
            </div>

            <div class="campo-input">
                <p>Gênero:</p>
                <select id="sel_genero">
                    <option value="" disabled selected>Selecione um gênero</option>
                    <option value="Fantasia">Fantasia</option>
                    <option value="Romance">Romance</option>
                    <option value="Ficção Científica">Ficção Científica</option>
                    <option value="Terror">Terror</option>
                    <option value="Biografia">Biografia</option>
                    <option value="Religioso">Religioso</option>
                    <option value="Tecnico">Técnico</option>
                    <option value="ficção Filosófica">Ficção Filosófica</option>
                </select>
            </div>

            <div class="campo-input">
                <p>Páginas:</p>
                <input type="number" id="ipt_paginas" placeholder="Ex: 310">
            </div>

            <div class="campo-input">
                <p>Status de leitura:</p>
                <select id="sel_status" onchange="verificarStatus()">
                    <option value="" disabled selected>Selecione</option>
                    <option value="lendo">Lendo</option>
                    <option value="concluido">Concluído</option>
                </select>
            </div>


            <div id="secao-conclusao" class="checkbox" style="display: none;"">

                <div class=" campo-input">
                <label>
                    <input type="checkbox" id="chk_favorito">
                    <p>Marcar como Favorito ⭐</p>
                </label>

            </div>

            <div class="campo-input">
                <p>Data conclusão</p>
                <input type="date" id="ipt_data_conclusao">
            </div>

            <div class="campo-input">
                <p>Avaliação (Estrelas):</p>
                <select id="sel_avaliacao">
                    <option value="5">⭐⭐⭐⭐⭐ (Excelente)</option>
                    <option value="4">⭐⭐⭐⭐☆ (Muito Bom)</option>
                    <option value="3">⭐⭐⭐☆☆ (Bom)</option>
                    <option value="2">⭐⭐☆☆☆ (Regular)</option>
                    <option value="1">⭐☆☆☆☆ (Ruim)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="form-acoes">
        <button class="btn-cancelar" onclick="window.location.href='./meuslivros.html'">Cancelar</button>
        <button class="btn-salvar" onclick="editarLivro()">Salvar Livro</button>
    </div>
    </div>

    <footer>
        © 2026 Melissa Ribeiro • Feito com ♡
    </footer>

</body>

</html>
<script>
    function verificarStatus() {

        var status = document.getElementById("sel_status").value;
        var secaoConclusao = document.getElementById("secao-conclusao");

        if (status == "lendo") {
            secaoConclusao.style.display = "none";

        } else {
            secaoConclusao.style.display = "block";

        }
    }


    function buscarLivroParaEditar() { // função para busca os dados no BD, para o user não precisar redigitar o que estava definido

        var parametros = new URLSearchParams(window.location.search); 
        // URLSearchParams = transforma a URl em algo legivel
        var idLivro = parametros.get('id'); // extrai o valor do parâmetro id

        var idUsuario = sessionStorage.ID_USUARIO; // id do usuário logado

        fetch(`/usuarios/buscarLivros/${idLivro}`, { // fetch faz requisição HTTP para servidor
            method: "GET" // GET busca dados no banco
        })
            .then(function (resposta) { // then executa quando o servidor responde
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    resposta.json().then(function (dadosDoBanco) { // converte  string para bjeto
                        var livro = dadosDoBanco[0]; // pega o primeiro (e único) resultado, pois o banco retorna um array mesmo com um livro só.
                        // livro é o OBJETO (json) — o primeiro item do array

                        // Preenche os campos com os dados do livro
                        ipt_titulo.value = livro.titulo;
                        ipt_autor.value = livro.autor;
                        ipt_paginas.value = livro.pages;
                        sel_genero.value = livro.genero;
                        sel_status.value = livro.stts;


                        console.log("stts do banco:", livro.stts);  
                        console.log("sel_status.value após preencher:", sel_status.value); // apenas para verifiar se há erro

                        // Se tiver data de conclusão, mostra a seção que estava escondida;
                        if (livro.stts == 'concluido') {
                            document.getElementById('secao-conclusao').style.display = 'block';
                            ipt_data_conclusao.value = livro.dt_conclusao;
                            chk_favorito.checked = livro.favorito == 1;
                            sel_avaliacao.value = livro.estrelas;
                        }
                    })

                }
            })
            .catch(function (resposta) { // captura qualquer erro que aconteça no fetch ou no .then - exibe o erro no console e um alert para o usuário.
                console.log(`#ERRO: ${resposta}`);
                alert(resposta);

            });

        return false;
    }



    function editarLivro() { // função chamada pra quando o usuário clica em salvar livros

        var parametros = new URLSearchParams(window.location.search); // recebe o id do livro como parâmetro
        var idLivro = parametros.get('id'); // pega o id da URL
        var titulo = ipt_titulo.value
        var autor = ipt_autor.value
        var pages = ipt_paginas.value
        var dt_conclusao = ipt_data_conclusao.value
        var favorito = chk_favorito.checked
        var avaliacao = sel_avaliacao.value
        var stts = sel_status.value
        var genero = sel_genero.value
        // variáveis

        //validações
        if (titulo == '') {
            alert("Insira o título do livro.")
        } else if (autor == '') {
            alert("Insira o autor do livro")
        } else if (ipt_paginas.value == '') {
            alert("Insira a quantidade de páginas do livro")
        } else if (sel_genero.value == '') {
            alert("Selecione o gênero do livro")
        } else if (sel_status.value == '') {
            alert("Selecione o status de leitura")
        }
        else {

            // Enviando o valor da nova input
            var idUsuario = sessionStorage.ID_USUARIO; // id do usuário logado
            console.log("stts:", stts);
            console.log("sel_status.value:", sel_status.value);
            fetch(`/usuarios/AlterarLivros/${idLivro}`, {
                method: "PUT", // PUT, pois quer ALTTERAR algom existente
                headers: {
                    "Content-Type": "application/json", // avisa o servidor que os dados estão em formato de Json
                },
                body: JSON.stringify({ //  converte o objeto JavaScript para texto JSON (formato que viaja pela internet)

                    //  nome que o controller usa para receber [...]Server
                    tituloServer: titulo,
                    autorServer: autor,
                    pagesServer: pages,
                    dt_conclusaoServer: dt_conclusao,
                    favoritoServer: favorito,
                    avaliacaoServer: avaliacao,
                    sttsServer: stts,
                    generoServer: genero,
                    idUsuarioServer: idUsuario // idUsuário no body, pois URL já tem o id do livro
                }),
            })
                .then(function (resposta) { // executa quando o servidor resçponde
                    console.log("resposta: ", resposta);

                    if (resposta.ok) {
                        alert("Livro editado com sucesso!");
                        setTimeout(() => {
                            window.location = "./meuslivros.html";
                        }, 1000); // se resposta ok, redireciona para página meus livros
                    } else {
                        throw "Houve um erro ao tentar realizar a alteração!";
                    }

                })
                .catch(function (resposta) {
                    console.log(`#ERRO: ${resposta}`);
                    alert(resposta);

                });

            return false;
        }
    }


    window.onload = function () {
        buscarLivroParaEditar();
    }; // Chama a função assim que a página terminar de carregar
</script>
