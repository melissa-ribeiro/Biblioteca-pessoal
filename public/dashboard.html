<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Pessoal - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/dashboard.css">
</head>

<body>

    <div class="dashboard-layout">

        <div class="sidebar">
            <h2>Biblioteca<br>Pessoal</h2>
            <div class="sidebar-links">
                <a href="./menu.html" class="active">Menu inicial</a>
                <a href="./meuslivros.html">Meus Livros</a>
                <a href="">Meu Perfil</a>
            </div>
            <a class="LogOut" href="./login.html">Logout</a>
        </div>

        <div class="main-content">

            <div class="boasvindas">
                <img id="avatarUsuario" src="" alt="Avatar">
                <span id="mensagemBoasVindas"></span>
            </div>

            <div class="containerkpi">
                <div class="kpis">

                    <div class="kpi kpi_destaque">
                        <p class="kpi_titulo">Livros lidos</p>
                        <h2 class="kpi_valor" id="kpi_livrosLidos"></h2>
                    </div>

                    <div class="kpi">
                        <p class="kpi_titulo">Livros em andamento</p>
                        <h2 class="kpi_valor" id="kpi_livrosLendo"></h2>
                    </div>

                    <div class="kpi">
                        <p class="kpi_titulo">Páginas lidas</p>
                        <h2 class="kpi_valor" id="kpi_paginasLidas"></h2>
                    </div>

                    <div class="kpi">
                        <p class="kpi_titulo">Total favoritados</p>
                        <h2 class="kpi_valor" id="kpi_favoritos"></h2>
                    </div>

                    <div class="kpi">
                        <p class="kpi_titulo">Lidos do mês</p>
                        <h2 class="kpi_valor" id="kpi_LidosMes"></h2>
                    </div>
                </div>
            </div>

            <div class="charts-container">

                <div class="grafico line-chart">
                    <div class="grafico_titulo">Livros lidos por mês</div>
                    <div class="canvas-wrapper">
                        <canvas id="Lidospormes"></canvas>
                    </div>
                </div>

                <div class="grafico pizza-chart">
                    <div class="grafico_titulo">Gêneros lidos</div>
                    <div class="canvas-wrapper">
                        <canvas id="generoslidos"></canvas>
                    </div>
                </div>
            </div>

            <footer>
                <p style="color: rgb(53, 7, 53);">© 2026 Melissa Ribeiro • Feito com <span
                        style="color: rgb(124, 12, 123);">♡</span></p>
            </footer>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./js/dashboard.js"></script>
</body>

</html>
<script>
    var nickname = sessionStorage.NICKNAME_USUARIO;
    var pronome = sessionStorage.PRONOME_USUARIO;
    var avatarId = sessionStorage.AVATAR_USUARIO;
    var caminhoFinal = ''

    if (avatarId == 1) {
        caminhoFinal = "./imagens/menina1.png - Editado.png"
    } else if (avatarId == 2) {
        caminhoFinal = "./imagens/menino1.png - Editado.png"
    } else if (avatarId == 3) {
        caminhoFinal = "./imagens/menina2.png - Editado.png"
    } else if (avatarId == 4) {
        caminhoFinal = "./imagens/menino2.png - Editado.png"
    } else if (avatarId == 5) {
        caminhoFinal = "./imagens/menina3.png - Editado.png"
    } else if (avatarId == 6) {
        caminhoFinal = "./imagens/menino3.png - Editado.png"
    }

    avatarUsuario.src = caminhoFinal;
    console.log("Apelido:", nickname);
    console.log("ID do Avatar:", avatarId);
    console.log("Caminho gerado:", caminhoFinal);

    if (pronome == 'ela/dela') {
        mensagemBoasVindas.innerHTML = `Seja bem-vinda, ${nickname}!`;
    } else if (pronome == 'ele/dele') {
        mensagemBoasVindas.innerHTML = `Seja bem-vindo, ${nickname}!`;
    } else {
        mensagemBoasVindas.innerHTML = `Boas-vindas, ${nickname}!`;
    }

 </script>
